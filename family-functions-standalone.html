<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Family Functions Interactive Packet</title>
    <style>
:root {
  color-scheme: light;
  --ink: #1e2430;
  --muted: #586174;
  --line: #d8ddea;
  --paper: #fff8ec;
  --panel: #ffffff;
  --blue: #1f6aa5;
  --blue-dark: #153f73;
  --coral: #ef6b4a;
  --gold: #f3b43f;
  --green: #32a06f;
  --violet: #7860d7;
  --focus: #0f6cb6;
  --shadow: 0 14px 34px rgba(31, 63, 103, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top left, rgba(239, 107, 74, 0.20), transparent 28rem),
    radial-gradient(circle at 92% 7%, rgba(50, 160, 111, 0.18), transparent 24rem),
    linear-gradient(180deg, #f9fcff 0%, var(--paper) 46%, #fffdf7 100%);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.45;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app-header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: center;
  padding: 24px clamp(16px, 4vw, 48px);
  background:
    linear-gradient(135deg, rgba(31, 106, 165, 0.96), rgba(21, 63, 115, 0.98)),
    #174a88;
  border-bottom: 1px solid var(--line);
  color: #fff;
}

.brand-mark {
  width: 78px;
  height: 78px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: #11365f;
  border: 2px solid rgba(255, 255, 255, 0.55);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.20);
}

.brand-mark img {
  display: block;
  width: 58px;
  height: 58px;
  object-fit: contain;
}

.eyebrow {
  margin: 0 0 4px;
  color: #ffe08a;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2,
h3 {
  margin: 0;
  letter-spacing: 0;
}

h1 {
  font-size: clamp(1.55rem, 2.8vw, 2.55rem);
  line-height: 1.05;
}

h2 {
  font-size: 1.18rem;
}

h3 {
  font-size: 1rem;
}

.score-pill {
  min-width: 88px;
  padding: 10px 14px;
  border: 2px solid rgba(255, 255, 255, 0.72);
  border-radius: 14px;
  color: #fff;
  background: rgba(255, 255, 255, 0.13);
  font-size: 1.25rem;
  font-weight: 800;
  text-align: center;
}

label span,
.field-label {
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 700;
}

input,
select,
textarea {
  width: 100%;
  min-height: 42px;
  border: 2px solid #c8d1df;
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
  padding: 9px 10px;
}

textarea {
  min-height: 94px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus,
button:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent);
  outline-offset: 2px;
}

.primary-button,
.ghost-button,
.icon-button {
  border: 1px solid transparent;
  border-radius: 10px;
  font-weight: 700;
}

.primary-button {
  min-height: 42px;
  padding: 0 16px;
  background: linear-gradient(135deg, var(--blue), var(--violet));
  color: #fff;
  box-shadow: 0 8px 18px rgba(31, 106, 165, 0.24);
}

.primary-button:hover {
  background: linear-gradient(135deg, var(--blue-dark), #5b48b6);
}

.ghost-button {
  min-height: 36px;
  padding: 0 11px;
  background: #fff;
  border-color: var(--line);
  color: var(--ink);
}

.ghost-button:hover {
  border-color: var(--blue);
}

.layout {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr) 260px;
  gap: 18px;
  padding: 18px clamp(16px, 4vw, 48px) 42px;
}

.activity-nav,
.summary-panel,
.activity-root {
  align-self: start;
}

.activity-nav,
.summary-panel {
  position: sticky;
  top: 16px;
}

.activity-nav {
  display: grid;
  gap: 8px;
}

#activityNav {
  display: grid;
  gap: 8px;
}

.identity-panel {
  display: grid;
  gap: 10px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 2px solid #e2e9f3;
}

.identity-panel h2 {
  color: var(--blue-dark);
  font-size: 1rem;
}

.submission-panel {
  display: grid;
  gap: 8px;
  min-height: 0;
}

.submission-panel:empty {
  display: none;
}

.submission-panel p {
  margin: 0;
  font-size: 0.86rem;
}

.submission-actions {
  display: grid;
  gap: 8px;
}

.nav-button {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 9px;
  align-items: center;
  min-height: 44px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
  text-align: left;
}

.nav-button[aria-current="page"] {
  border-color: var(--blue);
  background: #eef7ff;
  box-shadow: inset 5px 0 0 var(--coral), var(--shadow);
}

.nav-index {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #ffecbd;
  color: #73470b;
  font-size: 0.78rem;
  font-weight: 800;
}

.nav-score {
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
}

.activity-root {
  display: grid;
  gap: 14px;
}

.section-intro,
.summary-panel,
.result-panel {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  box-shadow: var(--shadow);
}

.summary-panel {
  display: grid;
  gap: 12px;
}

.section-intro {
  display: grid;
  gap: 8px;
}

.section-intro p {
  margin: 0;
  color: var(--muted);
}

.grid-list {
  display: grid;
  gap: 12px;
}

.card {
  display: grid;
  gap: 12px;
  padding: 16px;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 10px 22px rgba(31, 63, 103, 0.08);
}

.focus-card {
  border-color: #b9d8f1;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 252, 244, 0.98)),
    #fff;
}

.card-header {
  display: flex;
  gap: 10px;
  align-items: start;
  justify-content: space-between;
}

.tag {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 3px 8px;
  border-radius: 999px;
  background: #fff2de;
  color: #74450c;
  font-size: 0.78rem;
  font-weight: 800;
}

.auto-tag {
  background: #e4f5ec;
  color: #1a6b40;
}

.review-tag {
  background: #ede8fb;
  color: #4a359a;
}

.review-label {
  font-size: 0.72rem;
  font-weight: 700;
  color: #7860d7;
  white-space: nowrap;
}

.review-star {
  color: var(--violet);
  font-size: 0.82rem;
  margin-left: 2px;
}

.score-divider {
  height: 1px;
  background: var(--line);
  margin: 4px 0;
}

.score-summary-row dt {
  font-weight: 700;
  color: var(--ink);
}

.score-summary-row dd strong {
  color: var(--blue-dark);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.scenario-text {
  margin: 0;
  font-size: 1.18rem;
  font-weight: 700;
}

.two-col {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.three-col {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.choice-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.choice {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 38px;
  padding: 7px 10px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #fff;
}

.big-choice {
  min-width: 170px;
  justify-content: center;
  font-weight: 800;
}

.choice input {
  width: auto;
  min-height: auto;
}

.reference-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.reference-card {
  border-top: 4px solid var(--blue);
}

.reference-card:nth-child(2n) {
  border-top-color: var(--coral);
}

.reference-card:nth-child(3n) {
  border-top-color: var(--green);
}

.mode-switch {
  display: inline-grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  padding: 6px;
  border: 2px solid #d5e3f1;
  border-radius: 999px;
  background: #fff;
  box-shadow: var(--shadow);
}

.mode-switch button {
  min-height: 42px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-weight: 800;
}

.mode-switch button.active {
  background: linear-gradient(135deg, var(--blue), var(--green));
  color: #fff;
}

.reference-card p,
.card p,
.result-panel p {
  margin: 0;
}

.muted {
  color: var(--muted);
}

.strategy-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  max-height: 340px;
  overflow-y: auto;
  padding-right: 4px;
}

.question-pager {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px;
  border: 1px solid #dbe5f2;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.78);
}

.question-pager span {
  color: var(--blue-dark);
  font-weight: 800;
  text-align: center;
}

.question-pager button:disabled {
  opacity: 0.45;
  cursor: default;
}

.progress-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  padding: 4px 0;
}

.dot {
  width: 14px;
  height: 14px;
  padding: 0;
  border: 2px solid #b8c5d5;
  border-radius: 50%;
  background: #fff;
}

.dot.active {
  border-color: var(--coral);
  background: var(--coral);
}

.drop-zone {
  display: grid;
  gap: 9px;
  min-height: 130px;
  padding: 14px;
  border: 3px dashed #a8c9e8;
  border-radius: 16px;
  background: #f4fbff;
}

.drop-zone.drag-over {
  border-color: var(--green);
  background: #ecfff5;
}

.selected-strategies {
  display: grid;
  gap: 8px;
}

.strategy-tile,
.strategy-chip {
  border: 2px solid #d5deeb;
  border-radius: 14px;
  background: #fff;
  color: var(--ink);
  text-align: left;
}

.strategy-tile {
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: 10px;
  align-items: center;
  min-height: 58px;
  padding: 10px;
  box-shadow: 0 8px 16px rgba(31, 63, 103, 0.08);
}

.strategy-tile span,
.strategy-chip strong {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #ffecbd;
  color: #73470b;
}

.strategy-tile.used {
  border-color: var(--green);
  background: #effff6;
}

.strategy-chip {
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: 10px;
  align-items: center;
  min-height: 48px;
  padding: 8px 10px;
}

.strategy-chip:hover {
  border-color: var(--coral);
}

.mini-list {
  margin: 0;
  padding-left: 18px;
}

.mini-list li + li {
  margin-top: 4px;
}

.rank-list {
  display: grid;
  gap: 8px;
}

.rank-item {
  display: grid;
  grid-template-columns: 34px 1fr auto auto;
  gap: 8px;
  align-items: center;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
}

.rank-number {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #eaf3f5;
  color: var(--blue-dark);
  font-weight: 800;
}

.icon-button {
  width: 34px;
  height: 34px;
  padding: 0;
  background: #f6f7f9;
  border-color: var(--line);
}

.icon-button:disabled {
  opacity: 0.45;
  cursor: default;
}

.meter {
  overflow: hidden;
  height: 12px;
  margin: 12px 0;
  border-radius: 999px;
  background: #e7ebf0;
}

.meter span {
  display: block;
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--coral), var(--gold), var(--green));
  transition: width 200ms ease;
}

dl {
  display: grid;
  gap: 8px;
  margin: 0;
}

.score-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  color: var(--muted);
  font-size: 0.9rem;
}

.score-row strong {
  color: var(--ink);
}

.result-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.toast {
  position: fixed;
  right: 18px;
  bottom: 18px;
  max-width: min(420px, calc(100vw - 36px));
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--ink);
  color: #fff;
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: opacity 160ms ease, transform 160ms ease;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

@media (max-width: 1100px) {
  .layout {
    grid-template-columns: 200px minmax(0, 1fr);
  }

  .summary-panel {
    position: static;
    grid-column: 1 / -1;
    order: 3;
  }

  .reference-grid,
  .three-col {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 760px) {
  .app-header,
  .layout {
    grid-template-columns: 1fr;
  }

  .score-pill {
    justify-self: start;
  }

  .activity-nav {
    position: static;
  }

  #activityNav {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .reference-grid,
  .two-col,
  .three-col,
  .strategy-grid {
    grid-template-columns: 1fr;
  }

  .nav-button {
    grid-template-columns: auto 1fr;
  }

  .nav-score {
    grid-column: 2;
  }
}

    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-mark">
        <img src="https://cmsv2-assets.apptegy.net/uploads/31303/file/5453843/c76a25f3-61e0-4b22-8560-f7f2c77127a3.png" alt="Greece Central Schools logo">
      </div>
      <div>
        <p class="eyebrow">Grade 6 Family and Childcare</p>
        <h1>Family Functions & Healthy Families</h1>
      </div>
      <div class="score-pill" id="overallScore">0%</div>
    </header>

    <div class="layout">
      <nav class="activity-nav" aria-label="Activities">
        <div id="activityNav"></div>
      </nav>
      <main id="activityRoot" class="activity-root" tabindex="-1"></main>
      <aside class="summary-panel" aria-label="Information hub">
        <h2>Score</h2>
        <div class="meter">
          <span id="meterFill"></span>
        </div>
        <dl id="scoreBreakdown"></dl>
        <section class="identity-panel" aria-label="Student information">
          <h2>Student</h2>
          <label>
            <span>First name</span>
            <input id="firstName" autocomplete="given-name" placeholder="First name">
          </label>
          <label>
            <span>Last name</span>
            <input id="lastName" autocomplete="family-name" placeholder="Last name">
          </label>
          <label>
            <span>Class period</span>
            <select id="classPeriod">
              <option value="">Choose period</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4/5">4/5</option>
              <option value="6/7">6/7</option>
              <option value="8">8</option>
              <option value="9">9</option>
            </select>
          </label>
          <label>
            <span>Teacher</span>
            <select id="teacherSelect">
              <option value="">Choose teacher</option>
              <option value="mccann">McCann</option>
              <option value="epping">Epping</option>
              <option value="billitier">Billitier</option>
              <option value="swanson">Swanson</option>
            </select>
          </label>
          <button id="submitWork" class="primary-button">Prepare Gmail Results</button>
          <div id="submissionPanel" class="submission-panel" aria-live="polite"></div>
        </section>
      </aside>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <iframe id="draftFrame" name="draftFrame" title="Gmail draft helper" hidden></iframe>

    <script>
const TEACHERS = [
  { id: "mccann",    name: "McCann",    email: "kevin.mccann@greececsd.org" },
  { id: "epping",    name: "Epping",    email: "christine.epping-plaisted@greececsd.org" },
  { id: "billitier", name: "Billitier", email: "hannah.billitier@greececsd.org" },
  { id: "swanson",   name: "Swanson",   email: "janene.swanson@greececsd.org" },
];

function getTeacher() {
  return TEACHERS.find((t) => t.id === state.student.teacher) || TEACHERS[0];
}
const APPS_SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyhFV6QJmNiH-ny6So0C-xv7_49akwmBYcI3OMVvqk81MqCAOX-72Hf3GD2KxqGp7Bmdg/exec";

const FUNCTIONS = [
  "Economic",
  "Protection",
  "Education",
  "Recreation",
  "Affection and Belonging",
  "Adaptation",
];

const functionNotes = {
  Economic: {
    definition: "Meeting material needs such as food, housing, clothing, supplies, and money planning.",
    example: "A family builds a budget and makes sure school supplies, winter coats, and meals are covered.",
    consequence: "Family members may go without food, stable housing, health care, or chances to join activities.",
    community: "Schools, food banks, and support programs may need to help when families cannot meet economic needs.",
  },
  Protection: {
    definition: "Keeping family members physically and emotionally safe, including health and emergency care.",
    example: "A parent schedules checkups, keeps a first aid kit stocked, and teaches what to do in a fire.",
    consequence: "Children may face harm with no adult help, and it becomes harder to learn, connect, or adapt.",
    community: "Teachers, counselors, hospitals, and child protection services may need to step in.",
  },
  Education: {
    definition: "Teaching values, culture, school habits, life skills, and practical knowledge.",
    example: "A grandparent helps a child read each night or teaches cultural recipes and family stories.",
    consequence: "Children may fall behind in school, miss guidance, or feel disconnected from their identity.",
    community: "When many families cannot support learning, the whole community's future workforce is affected.",
  },
  Recreation: {
    definition: "Building connection through play, relaxation, traditions, and shared fun.",
    example: "A family keeps a weekly game night, park visit, movie night, or cooking tradition.",
    consequence: "Relationships can become only about chores and needs, and children may seek connection elsewhere.",
    community: "Parks, clubs, youth programs, and community centers often fill the need for safe connection and fun.",
  },
  "Affection and Belonging": {
    definition: "Helping members feel loved, valued, comforted, and emotionally secure.",
    example: "A parent comforts a child after a failure and reminds them they are loved and valued.",
    consequence: "Children may struggle to trust others, manage emotions, or build healthy relationships.",
    community: "Counselors, therapists, and social workers often help people heal from a lack of belonging.",
  },
  Adaptation: {
    definition: "Adjusting roles, routines, and expectations when life changes or stress appears.",
    example: "After a job loss or move, family members make a new plan and share responsibilities.",
    consequence: "Responsibilities may become unfair, routines may fall apart, and members can feel alone in crisis.",
    community: "During disasters, downturns, or health crises, families that adapt well help communities recover faster.",
  },
};

const healthyTraits = [
  "Trust",
  "Respect",
  "Empathy",
  "Clear communication",
  "Healthy boundaries",
  "Fair expectations",
  "Repair after conflict",
  "Shared problem-solving",
];

const sortingCards = [
  { id: 1, text: "Dad picks up extra shifts so the family can afford school supplies and winter coats.", primary: "Economic" },
  { id: 2, text: "Mom schedules yearly checkups for all the kids and keeps a first aid kit fully stocked.", primary: "Protection" },
  { id: 3, text: "Grandpa sits with Maya every night to help her practice reading. She is starting to love books.", primary: "Education", overlap: ["Affection and Belonging"] },
  { id: 4, text: "On Sundays, the whole family goes to the park to play frisbee. Even Grandma comes.", primary: "Recreation", overlap: ["Affection and Belonging"] },
  { id: 5, text: "When Lily cried after failing her test, her mom held her and said, 'I'm proud of you for trying.'", primary: "Affection and Belonging" },
  { id: 6, text: "When dad lost his job, the family made a new budget together and cut back on extras until things improved.", primary: "Adaptation", overlap: ["Economic"] },
  { id: 7, text: "The family has a rule: no one goes to bed angry. They talk things out first.", primary: "Affection and Belonging", overlap: ["Adaptation"] },

function startAutoScroll(dir) {
  if (autoScrollDir === dir) return;
  autoScrollDir = dir;
  clearInterval(autoScrollTimer);
  if (dir !== 0) autoScrollTimer = setInterval(() => window.scrollBy(0, dir * 10), 16);
}

function loadState() {
  const saved = localStorage.getItem("familyFunctionsPacket");
  if (!saved) return structuredClone(defaultState);
  try {
    const merged = mergeState(structuredClone(defaultState), JSON.parse(saved));
    if (merged.student.name && !merged.student.firstName && !merged.student.lastName) {
      const parts = merged.student.name.trim().split(/\s+/);
      merged.student.firstName = parts.shift() || "";
      merged.student.lastName = parts.join(" ");
    }
    return merged;
  } catch {
    return structuredClone(defaultState);
  }
}

function mergeState(base, saved) {
  for (const key of Object.keys(saved || {})) {
    if (saved[key] && typeof saved[key] === "object" && !Array.isArray(saved[key])) {
      base[key] = mergeState(base[key] || {}, saved[key]);
    } else {
      base[key] = saved[key];
    }
  }
  return base;
}

function saveState() {
  localStorage.setItem("familyFunctionsPacket", JSON.stringify(state));
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function studentFullName() {
  return `${state.student.firstName || ""} ${state.student.lastName || ""}`.trim();
}

function wordCount(value) {
  return String(value || "").trim().split(/\s+/).filter(Boolean).length;
}

function completionPoint(value, minimum = 8) {
  return wordCount(value) >= minimum ? 1 : 0;
}

function keywordPoint(value, keywords) {
  const normalized = String(value || "").toLowerCase();
  return keywords.some((keyword) => normalized.includes(keyword.toLowerCase())) ? 1 : 0;
}

function scoreObject(points, possible) {
  return { points, possible, percent: possible ? Math.round((points / possible) * 100) : 100 };
}

function splitScore(autoPoints, autoPossible, shortPoints, shortPossible) {
  const points = autoPoints + shortPoints;
  const possible = autoPossible + shortPossible;
  return {
    auto: { points: autoPoints, possible: autoPossible },
    short: { points: shortPoints, possible: shortPossible },
    points,
    possible,
    percent: possible ? Math.round((points / possible) * 100) : 100,
  };
}

function getScores() {
  const scores = {};
  for (const activity of activities) scores[activity.id] = activity.score();
  const graded = activities.filter((activity) => activity.id !== "reference");
  const autoPoints = graded.reduce((sum, a) => sum + scores[a.id].auto.points, 0);
  const autoPossible = graded.reduce((sum, a) => sum + scores[a.id].auto.possible, 0);
  const shortPoints = graded.reduce((sum, a) => sum + scores[a.id].short.points, 0);
  const shortPossible = graded.reduce((sum, a) => sum + scores[a.id].short.possible, 0);
  const total = scoreObject(autoPoints + shortPoints, autoPossible + shortPossible);
  return { scores, total, autoTotal: { points: autoPoints, possible: autoPossible }, shortTotal: { points: shortPoints, possible: shortPossible } };
}

function getActivityTotal(id) {
  const totals = {
    sorting: sortingCards.length,
    healthy: healthyScenarios.length,
    missing: missingCards.length,
    fix: fixSituations.length,
    consequence: consequences.length,
    ranking: rankingPrompts.length + 1,
    case: caseStudy.questions.length,
  };
  return totals[id] || 1;
}

function getActivityIndex(id) {
  const total = getActivityTotal(id);
  const current = Number(state.progress[id] || 0);
  return Math.min(Math.max(current, 0), total - 1);
}

function setActivityIndex(id, index) {
  state.progress[id] = Math.min(Math.max(index, 0), getActivityTotal(id) - 1);
  saveState();
  renderApp();
}

function progressDots(id, total, current) {
  if (total <= 1) return "";
  return `
    <div class="progress-dots" aria-label="Question progress">
      ${Array.from({ length: total }, (_, index) => `
        <button class="dot${index === current ? " active" : ""}" data-step-jump="${index}" aria-label="Go to item ${index + 1}"></button>`).join("")}
    </div>`;
}

function questionPager(id, total, current) {
  if (total <= 1) return "";
  return `
    <div class="question-pager">
      <button class="ghost-button" data-step="-1"${current === 0 ? " disabled" : ""}>Back</button>
      <span>Item ${current + 1} of ${total}</span>
      <button class="primary-button" data-step="1"${current === total - 1 ? " disabled" : ""}>Next</button>
    </div>
    ${progressDots(id, total, current)}`;
}

}

      <div class="strategy-grid">
        ${strategies.map((text, index) => {
          const number = index + 1;
          const used = selected.includes(number);
          return `
            <button class="strategy-tile${used ? " used" : ""}" draggable="true" data-strategy="${number}">
              <span>${number}</span>
              ${escapeHtml(text)}
            </button>`;
        }).join("")}
      </div>
    </section>`);
}

function scoreFixIt() {
  let autoPoints = 0, shortPoints = 0;
  for (const item of fixSituations) {
    const entry = state.fix[item.id] || { strategies: [] };
    if ((entry.strategies || []).some((choice) => item.primary.includes(Number(choice)))) autoPoints += 1;
    shortPoints += completionPoint(entry.reason, 7);
  }
  return splitScore(autoPoints, fixSituations.length, shortPoints, fixSituations.length);
}

function renderConsequences() {
  const index = getActivityIndex("consequence");
  const item = consequences[index];
  return singleQuestion("consequence", "Consequence Cards", "Match each breakdown consequence to the family function.", `
    <article class="card focus-card">
      <div class="card-header">
        <h3>Consequence ${index + 1}</h3>
        <span class="tag auto-tag">1 pt auto</span>
      </div>
      <p>${escapeHtml(item.text)}</p>
      ${functionSelect(`consequence-${index}`, state.consequence[index] || "")}
    </article>`);
}

function scoreConsequences() {
  const points = consequences.reduce((sum, item, index) => sum + (state.consequence[index] === item.functionName ? 1 : 0), 0);
  return splitScore(points, consequences.length, 0, 0);
}

function renderRanking() {
  return `
    ${sectionIntro("Importance Ranking", "Rank the six functions from most important to least important and defend your choices.")}
    <section class="card focus-card">
      <div class="card-header">
        <h3>Ranked Functions</h3>
        <span class="tag auto-tag">3 auto</span>
      </div>
      <p class="muted">Move the functions into your own order from most important to least important. (3 pts for changing from the default order)</p>
      <div class="rank-list">
        ${state.ranking.order.map((name, rankIndex) => `
          <div class="rank-item">
            <span class="rank-number">${rankIndex + 1}</span>
            <strong>${escapeHtml(name)}</strong>
            <button class="icon-button" data-rank-move="${rankIndex}" data-direction="-1" aria-label="Move ${escapeHtml(name)} up"${rankIndex === 0 ? " disabled" : ""}>↑</button>
            <button class="icon-button" data-rank-move="${rankIndex}" data-direction="1" aria-label="Move ${escapeHtml(name)} down"${rankIndex === state.ranking.order.length - 1 ? " disabled" : ""}>↓</button>
          </div>`).join("")}
      </div>
    </section>
    <section class="grid-list ranking-responses">
      ${rankingPrompts.map((prompt, index) => `
        <label class="card">
          <div class="card-header">
            <span>${escapeHtml(prompt)}</span>
            <span class="tag review-tag">1 ★ review</span>
          </div>
          <textarea name="ranking-response-${index}">${escapeHtml(state.ranking.responses[index] || "")}</textarea>
        </label>`).join("")}
    </section>`;
}

function scoreRanking() {
  const isEngaged = state.ranking.order.some((name, i) => name !== FUNCTIONS[i]);
  const autoPoints = isEngaged ? 3 : 0;
  const shortPoints = rankingPrompts.reduce((sum, _, i) => sum + completionPoint(state.ranking.responses[i], 8), 0);
  return splitScore(autoPoints, 3, shortPoints, rankingPrompts.length);
}

function renderCaseStudy() {
  const question = caseStudy.questions[getActivityIndex("case")];
  return singleQuestion("case", "Case Study: The Brennan Family", "Analyze the family across functions, healthy characteristics, and Fix It strategies.", `
    <section class="card">
      <h3>The Brennan Family</h3>
      <p>${escapeHtml(caseStudy.text)}</p>
      <div class="two-col">
        <div>
          <h3>What is going well</h3>

        </div>

          <h3>What is struggling</h3>
          <ul class="mini-list">${caseStudy.struggling.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>

      </div>
    </section>
    <div class="card focus-card">
      <div class="card-header">
        <span>${escapeHtml(question.prompt)}</span>

}

function scoreCaseStudy() {
  let shortPoints = 0;
  for (const question of caseStudy.questions) {
    const value = state.caseStudy[question.id] || "";
    shortPoints += completionPoint(value, 12) + keywordPoint(value, question.keywords);
  }
  return splitScore(0, 0, shortPoints, caseStudy.questions.length * 2);
}

function handleInput(event) {
  const target = event.target;
  const name = target.name || target.id || "";

  if (target.id === "firstName") state.student.firstName = target.value;
  if (target.id === "lastName") state.student.lastName = target.value;
  if (target.id === "classPeriod") state.student.period = target.value;
  if (target.id === "teacherSelect") state.student.teacher = target.value;

  if (name.startsWith("sorting-")) state.sorting[name.split("-")[1]] = target.value;

  if (name.startsWith("healthy-label-")) {
    const id = name.split("-")[2];
    state.healthy[id] = state.healthy[id] || {};
    state.healthy[id].label = target.value;
  }
  if (name.startsWith("healthy-reason-")) {
    const id = name.split("-")[2];
    state.healthy[id] = state.healthy[id] || {};
    state.healthy[id].reason = target.value;
  }

  if (name.startsWith("missing-function-")) {
    const id = name.split("-")[2];
    state.missing[id] = state.missing[id] || {};
    state.missing[id].functionName = target.value;
  }
  if (name.startsWith("missing-effect-")) {
    const id = name.split("-")[2];
    state.missing[id] = state.missing[id] || {};
    state.missing[id].effect = target.value;
  }
  if (name.startsWith("missing-affected-")) {
    const id = name.split("-")[2];
    state.missing[id] = state.missing[id] || {};
    state.missing[id].affected = target.value;
  }

  if (name.startsWith("fix-strategy-")) {
    const id = name.split("-")[2];
    state.fix[id] = state.fix[id] || { strategies: [] };
    const selected = Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map((item) => Number(item.value));
    state.fix[id].strategies = selected;
  }
  if (name.startsWith("fix-reason-")) {
    const id = name.split("-")[2];
    state.fix[id] = state.fix[id] || { strategies: [] };
    state.fix[id].reason = target.value;
  }

  if (name.startsWith("consequence-")) state.consequence[name.split("-")[1]] = target.value;
  if (name.startsWith("ranking-response-")) state.ranking.responses[name.split("-")[2]] = target.value;
  if (name.startsWith("case-response-")) state.caseStudy[name.split("-")[2]] = target.value;

  saveState();
  renderNav();
  renderScores();
}

function addStrategyToCurrentSituation(strategyNumber) {
  const item = fixSituations[getActivityIndex("fix")];
  state.fix[item.id] = state.fix[item.id] || { strategies: [] };
  const current = new Set(state.fix[item.id].strategies || []);
  current.add(Number(strategyNumber));
  state.fix[item.id].strategies = Array.from(current).sort((a, b) => a - b);
  saveState();
  renderApp();
}

function removeStrategyFromCurrentSituation(strategyNumber) {
  const item = fixSituations[getActivityIndex("fix")];
  state.fix[item.id] = state.fix[item.id] || { strategies: [] };
  state.fix[item.id].strategies = (state.fix[item.id].strategies || []).filter((number) => number !== Number(strategyNumber));
  saveState();
  renderApp();
}

function handleClick(event) {
  const nav = event.target.closest("[data-nav]");
  if (nav) setActive(nav.dataset.nav);

  const stepButton = event.target.closest("[data-step]");
  if (stepButton) {
    setActivityIndex(activeActivity, getActivityIndex(activeActivity) + Number(stepButton.dataset.step));
  }

  const jumpButton = event.target.closest("[data-step-jump]");
  if (jumpButton) {
    setActivityIndex(activeActivity, Number(jumpButton.dataset.stepJump));
  }

  const referenceButton = event.target.closest("[data-reference-mode]");
  if (referenceButton) {
    state.referenceMode = referenceButton.dataset.referenceMode;
    saveState();
    renderApp();
  }

  const strategyTile = event.target.closest("[data-strategy]");
  if (strategyTile) {
    addStrategyToCurrentSituation(strategyTile.dataset.strategy);
  }

  const removeStrategy = event.target.closest("[data-remove-strategy]");
  if (removeStrategy) {
    removeStrategyFromCurrentSituation(removeStrategy.dataset.removeStrategy);
  }

  const emailAction = event.target.closest("[data-email-action]");
  if (emailAction && lastSubmission) {
    const action = emailAction.dataset.emailAction;
    if (action === "download") {
      downloadReport(lastSubmission.report, lastSubmission.filename);
      showToast("Results file downloaded again.");
    }
    if (action === "gmail") {
      openGmail(lastSubmission.report, lastSubmission.filename, lastSubmission.submittedAt);
      showToast("Gmail opened again.");
    }
    if (action === "draft") {
      createGmailDraft(lastSubmission.report, lastSubmission.filename, lastSubmission.submittedAt)
        .then(() => showToast("Gmail draft requested again."))
        .catch(() => showToast("Gmail draft retry did not complete."));
    }
  }

  const moveButton = event.target.closest("[data-rank-move]");
  if (moveButton) {
    const index = Number(moveButton.dataset.rankMove);
    const direction = Number(moveButton.dataset.direction);
    const nextIndex = index + direction;
    if (nextIndex >= 0 && nextIndex < state.ranking.order.length) {
      const order = state.ranking.order;
      [order[index], order[nextIndex]] = [order[nextIndex], order[index]];
      saveState();
      renderApp();
    }
  }
}

function handleDragStart(event) {
  const tile = event.target.closest("[data-strategy]");
  if (!tile) return;
  event.dataTransfer.setData("text/plain", tile.dataset.strategy);
  event.dataTransfer.effectAllowed = "copy";
}

function handleDragOver(event) {
  const threshold = 80;
  if (event.clientY < threshold) startAutoScroll(-1);
  else if (event.clientY > window.innerHeight - threshold) startAutoScroll(1);
  else startAutoScroll(0);

  const zone = event.target.closest("[data-drop-situation]");
  if (!zone) return;
  event.preventDefault();
  zone.classList.add("drag-over");
}

function handleDragLeave(event) {
  startAutoScroll(0);
  const zone = event.target.closest("[data-drop-situation]");
  if (zone) zone.classList.remove("drag-over");
}

function handleDrop(event) {
  startAutoScroll(0);
  const zone = event.target.closest("[data-drop-situation]");
  if (!zone) return;
  event.preventDefault();
  zone.classList.remove("drag-over");
  const strategyNumber = event.dataTransfer.getData("text/plain");
  if (strategyNumber) addStrategyToCurrentSituation(strategyNumber);
}

function buildReport() {
  const { scores, total, autoTotal, shortTotal } = getScores();
  const name = studentFullName();
  const lines = [];

  lines.push("============================================================");
  lines.push("FAMILY FUNCTIONS & HEALTHY FAMILIES — RESULTS REPORT");
  lines.push("============================================================");
  lines.push(`Student:      ${name || "Not entered"}`);
  lines.push(`Class period: ${state.student.period || "Not entered"}`);
  lines.push(`Teacher:      ${getTeacher().name}`);
  lines.push(`Total score:  ${total.points} / 100 pts`);
  lines.push(`  Auto-graded:    ${autoTotal.points} / ${autoTotal.possible} pts`);
  lines.push(`  Short answers:  ${shortTotal.points} / ${shortTotal.possible} pts (provisional — see section below)`);
  lines.push("");

  lines.push("------------------------------------------------------------");
  lines.push("AUTO-GRADED RESULTS");
  lines.push("------------------------------------------------------------");

  const sortScore = scores.sorting;
  lines.push(`Function Sorting: ${sortScore.auto.points} / ${sortScore.auto.possible} pts`);
  for (const card of sortingCards) {
    const answer = state.sorting[card.id] || "[blank]";
    const correct = answer === card.primary;
    lines.push(`  ${card.id}. Student: ${answer} | Correct: ${card.primary} ${correct ? "✓" : "✗"}`);
  }
  lines.push("");

  const healthyScore = scores.healthy;
  lines.push(`Healthy or Unhealthy (labels): ${healthyScore.auto.points} / ${healthyScore.auto.possible} pts`);
  for (const item of healthyScenarios) {
    const entry = state.healthy[item.id] || {};
    const correct = entry.label === item.answer;
    lines.push(`  ${item.id}. Student: ${entry.label || "[blank]"} | Correct: ${item.answer} ${correct ? "✓" : "✗"}`);
  }
  lines.push("");

  const missingScore = scores.missing;
  lines.push(`What's Missing (function ID): ${missingScore.auto.points} / ${missingScore.auto.possible} pts`);
  for (const card of missingCards) {
    const entry = state.missing[card.id] || {};
    const correct = entry.functionName === card.answer;
    lines.push(`  ${card.id}. ${card.family} | Student: ${entry.functionName || "[blank]"} | Correct: ${card.answer} ${correct ? "✓" : "✗"}`);
  }
  lines.push("");

  const fixScore = scores.fix;
  lines.push(`Fix It (strategy selection): ${fixScore.auto.points} / ${fixScore.auto.possible} pts`);
  for (const item of fixSituations) {
    const entry = state.fix[item.id] || {};
    const selected = (entry.strategies || []).join(", ") || "[blank]";
    const correct = (entry.strategies || []).some((c) => item.primary.includes(Number(c)));
    lines.push(`  ${item.id}. Selected: ${selected} | Primary: ${item.primary.join(", ")} ${correct ? "✓" : "✗"}`);
  }
  lines.push("");

  const conScore = scores.consequence;
  lines.push(`Consequences: ${conScore.auto.points} / ${conScore.auto.possible} pts`);
  consequences.forEach((item, index) => {
    const answer = state.consequence[index] || "[blank]";
    const correct = answer === item.functionName;
    lines.push(`  ${index + 1}. Student: ${answer} | Correct: ${item.functionName} ${correct ? "✓" : "✗"}`);
  });
  lines.push("");

  const rankScore = scores.ranking;
  const isEngaged = state.ranking.order.some((n, i) => n !== FUNCTIONS[i]);
  lines.push(`Ranking (re-ordered from default): ${rankScore.auto.points} / ${rankScore.auto.possible} pts — ${isEngaged ? "Yes ✓" : "No ✗"}`);
  lines.push("  Order: " + state.ranking.order.map((n, i) => `${i + 1}. ${n}`).join(" | "));
  lines.push("");

  lines.push("------------------------------------------------------------");
  lines.push(`SHORT ANSWER RESPONSES — TEACHER REVIEW (${shortTotal.possible} pts total)`);
  lines.push("Provisional word-count score shown. Assign final points as needed.");
  lines.push("------------------------------------------------------------");

  lines.push("");
  lines.push(`Healthy or Unhealthy — Written Reasons (${healthyScore.short.possible} pts, 1 pt each)`);
  for (const item of healthyScenarios) {
    const entry = state.healthy[item.id] || {};
    const wc = wordCount(entry.reason);
    lines.push(`  ${item.id}. [${wc} words] ${entry.reason || "[blank]"}`);
    lines.push(`     Scenario: ${item.text}`);
  }
  lines.push("");

  lines.push(`What's Missing — Written Responses (${missingScore.short.possible} pts, 1 pt each)`);
  for (const card of missingCards) {
    const entry = state.missing[card.id] || {};
    lines.push(`  ${card.id}. ${card.family}`);
    lines.push(`     Effect [${wordCount(entry.effect)} words]: ${entry.effect || "[blank]"}`);
    lines.push(`     Most affected [${wordCount(entry.affected)} words]: ${entry.affected || "[blank]"}`);
  }
  lines.push("");

  lines.push(`Fix It — Written Reasons (${fixScore.short.possible} pts, 1 pt each)`);
  for (const item of fixSituations) {
    const entry = state.fix[item.id] || {};
    const wc = wordCount(entry.reason);
    lines.push(`  ${item.id}. [${wc} words] ${entry.reason || "[blank]"}`);
    lines.push(`     Situation: ${item.text}`);
  }
  lines.push("");

  lines.push(`Ranking Written Responses (${rankScore.short.possible} pts, 1 pt each)`);
  rankingPrompts.forEach((prompt, index) => {
    const wc = wordCount(state.ranking.responses[index]);
    lines.push(`  Q${index + 1} [${wc} words]: ${state.ranking.responses[index] || "[blank]"}`);
    lines.push(`     Prompt: ${prompt}`);
  });
  lines.push("");

  const caseScore = scores.case;
  lines.push(`Case Study — The Brennan Family (${caseScore.short.possible} pts, 2 pts each)`);
  caseStudy.questions.forEach((question) => {
    const value = state.caseStudy[question.id] || "";
    const wc = wordCount(value);
    lines.push(`  Q${question.id} [${wc} words]: ${value || "[blank]"}`);
    lines.push(`     Prompt: ${question.prompt}`);
  });
  lines.push("");
  lines.push("============================================================");

  return lines.join("\n");
}

function submissionTimestamp() {
  const now = new Date();
  submissionCounter += 1;
  const stamp = `${now.toISOString().replace(/[:.]/g, "-")}-${submissionCounter}`;
  const label = now.toLocaleString([], {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
  });
  return { stamp, label };
}

function makeSubmissionPackage() {
  const report = buildReport();
  const { stamp, label } = submissionTimestamp();
  const safeName = (studentFullName() || "student").trim().replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "") || "student";
  const filename = `family-functions-results-${safeName}-${stamp}.txt`;
  return { report, filename, submittedAt: label };
}

function downloadReport(report, filename) {
  const blob = new Blob([report], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.append(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  return filename;
}

function openGmail(report, filename, submittedAt) {
  const { total } = getScores();
  const name = studentFullName();
  const teacher = getTeacher();
  const subject = `Family Functions Packet - ${name || "Student"} - ${total.percent}% - ${submittedAt}`;
  const summary = [
    `Student: ${name || "Not entered"}`,
    `Class period: ${state.student.period || "Not entered"}`,
    `Teacher: ${teacher.name}`,
    `Overall score: ${total.points}/${total.possible} (${total.percent}%)`,
    "",
    `Results file generated: ${filename}`,
    "",
    "The complete response report is included in the generated text file.",
  ].join("\n");
  const url = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(teacher.email)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(summary)}`;
  window.open(url, "_blank", "noopener,noreferrer");
}

async function createGmailDraft(report, filename, submittedAt) {
  if (!APPS_SCRIPT_WEB_APP_URL) return false;
  const { total } = getScores();
  const name = studentFullName();
  const teacher = getTeacher();
  const payload = {
    to: teacher.email,
    subject: `Family Functions Packet - ${name || "Student"} - ${total.percent}% - ${submittedAt}`,
    filename,
    report,
    summary: `Student: ${name || "Not entered"}\nClass period: ${state.student.period || "Not entered"}\nTeacher: ${teacher.name}\nOverall score: ${total.points}/${total.possible} (${total.percent}%)`,
  };
  postToAppsScript(payload);
  return true;
}

function postToAppsScript(payload) {
  const form = document.createElement("form");
  form.method = "POST";
  form.action = APPS_SCRIPT_WEB_APP_URL;
  form.target = "draftFrame";
  form.style.display = "none";

  for (const [key, value] of Object.entries(payload)) {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = key;
    input.value = value;
    form.append(input);
  }

  document.body.append(form);
  form.submit();
  window.setTimeout(() => form.remove(), 1000);
}

async function submitWork() {
  const submission = makeSubmissionPackage();
  lastSubmission = submission;
  renderSubmissionPanel("Preparing results...");

  if (!APPS_SCRIPT_WEB_APP_URL) {
    openGmail(submission.report, submission.filename, submission.submittedAt);
  }

  const filename = downloadReport(submission.report, submission.filename);
  const drafted = await createGmailDraft(submission.report, filename, submission.submittedAt).catch(() => false);
  if (drafted) {
    renderSubmissionPanel("Gmail draft requested. You can retry or download again below.");
    showToast("A Gmail draft was requested and the results file was generated.");
  } else {
    renderSubmissionPanel("Results prepared. Use the buttons below if Gmail did not open or the download was missed.");
    showToast("A Gmail message opened and the results file was generated.");
  }
}

function renderSubmissionPanel(message = "") {
  const panel = document.getElementById("submissionPanel");
  if (!panel) return;
  if (!lastSubmission) {
    panel.innerHTML = "";
    return;
  }
  panel.innerHTML = `
    <p>${escapeHtml(message || "Results are ready.")}</p>
    <p class="muted">Last prepared: ${escapeHtml(lastSubmission.submittedAt)}</p>
    <div class="submission-actions">
      <button class="ghost-button" data-email-action="download">Download again</button>
      ${APPS_SCRIPT_WEB_APP_URL
        ? `<button class="ghost-button" data-email-action="draft">Create Gmail draft again</button>`
        : `<button class="ghost-button" data-email-action="gmail">Open Gmail again</button>`}
    </div>`;
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 3600);
}

document.addEventListener("input", handleInput);
document.addEventListener("change", handleInput);
document.addEventListener("click", handleClick);
document.addEventListener("dragstart", handleDragStart);
document.addEventListener("dragend", () => startAutoScroll(0));
document.addEventListener("dragover", handleDragOver);
document.addEventListener("dragleave", handleDragLeave);
document.addEventListener("drop", handleDrop);
document.getElementById("submitWork").addEventListener("click", submitWork);

renderApp();

    </script>
