<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Family Functions Interactive Packet</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand-mark">
        <img src="https://cmsv2-assets.apptegy.net/uploads/31303/file/5453843/c76a25f3-61e0-4b22-8560-f7f2c77127a3.png" alt="Greece Central Schools logo">
      </div>
      <div>
        <p class="eyebrow">Grade 6 Family and Childcare</p>
        <h1>Family Functions & Healthy Families</h1>
      </div>
      <div class="score-pill" id="overallScore">0%</div>
    </header>

    <div class="layout">
      <nav class="activity-nav" aria-label="Activities">
        <div id="activityNav"></div>
      </nav>
      <main id="activityRoot" class="activity-root" tabindex="-1"></main>
      <aside class="summary-panel" aria-label="Information hub">
        <h2>Score</h2>
        <div class="meter">
          <span id="meterFill"></span>
        </div>
        <dl id="scoreBreakdown"></dl>
        <section class="identity-panel" aria-label="Student information">
          <h2>Student</h2>
          <label>
            <span>First name</span>
            <input id="firstName" autocomplete="given-name" placeholder="First name">
          </label>
          <label>
            <span>Last name</span>
            <input id="lastName" autocomplete="family-name" placeholder="Last name">
          </label>
          <label>
            <span>Class period</span>
            <select id="classPeriod">
              <option value="">Choose period</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4/5">4/5</option>
              <option value="6/7">6/7</option>
              <option value="8">8</option>
              <option value="9">9</option>
            </select>
          </label>
          <label>
            <span>Teacher</span>
            <select id="teacherSelect">
              <option value="">Choose teacher</option>
              <option value="mccann">McCann</option>
              <option value="epping">Epping</option>
              <option value="billitier">Billitier</option>
              <option value="swanson">Swanson</option>
            </select>
          </label>
          <button id="submitWork" class="primary-button">Prepare Gmail Results</button>
          <div id="submissionPanel" class="submission-panel" aria-live="polite"></div>
        </section>
      </aside>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <iframe id="draftFrame" name="draftFrame" title="Gmail draft helper" hidden></iframe>

    <script src="app.js"></script>
  </body>
</html>
